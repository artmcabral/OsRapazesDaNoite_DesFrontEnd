
<section>

  <h2>Tarefas</h2>

  <!-- Barra de busca e filtros -->
  <app-barra-filtros />

  <!-- ISSUE #32 - Estado de carregamento -->
  @if (carregando()) {

    <app-carregando
      mensagem="Carregando tarefas..."
    />

  } @else if (erro(); as mensagem) {

    <!-- ISSUE #33 - Tratamento de erro -->
    <app-mensagem-erro
      [mensagem]="mensagem"
      (tentarNovamente)="carregar()"
    />

  } @else if (tarefas().length === 0) {

    <!-- ISSUE #34 - Lista vazia -->
    <app-estado-vazio
      titulo="Nenhuma tarefa cadastrada ainda."
      dica="Crie a primeira tarefa para começar."
    >
      <a
        class="btn btn-primary"
        routerLink="/tarefas/nova"
      >
        + Nova tarefa
      </a>
    </app-estado-vazio>

  } @else if (tarefasFiltradas().length === 0) {

    <!-- ISSUE #34 - Nenhuma tarefa encontrada -->
    <app-estado-vazio
      titulo="Nenhuma tarefa encontrada."
      dica="Nenhuma tarefa corresponde à busca e aos filtros selecionados."
    >
      <button
        type="button"
        (click)="limparFiltros()"
      >
        Limpar busca e filtros
      </button>
    </app-estado-vazio>

  } @else {

    <p>
      {{ tarefasFiltradas().length }} tarefa(s) encontrada(s).
    </p>

    <ul class="lista">

      @for (t of tarefasFiltradas(); track t.id) {

        <li>
          <app-tarefa-card
            [tarefa]="t"
            (statusAlterado)="aoAlterarStatus($event)"
            (excluida)="aoExcluir($event)"
          />
        </li>

      }

    </ul>

  }

</section>
