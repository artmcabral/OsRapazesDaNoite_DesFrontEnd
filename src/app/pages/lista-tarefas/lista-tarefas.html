<section>
  <h2>Tarefas</h2>

  <div class="filtros">
    <label for="busca">Buscar por título ou responsável</label>
    <input
      id="busca"
      type="search"
      placeholder="Digite para pesquisar..."
      [value]="filtros().busca"
      (input)="atualizarBusca($any($event.target).value)"
    />

    <label for="status">Filtrar por status</label>
    <select
      id="status"
      [value]="filtros().status"
      (change)="atualizarStatus($any($event.target).value)"
    >
      <option value="todos">Todos os status</option>
      <option value="a-fazer">A fazer</option>
      <option value="em-andamento">Em andamento</option>
      <option value="em-revisao">Em revisão</option>
      <option value="concluida">Concluída</option>
    </select>

    <label for="prioridade">Filtrar por prioridade</label>
    <select
      id="prioridade"
      [value]="filtros().prioridade"
      (change)="atualizarPrioridade($any($event.target).value)"
    >
      <option value="todas">Todas as prioridades</option>
      <option value="baixa">Baixa</option>
      <option value="media">Média</option>
      <option value="alta">Alta</option>
    </select>
  </div>

  @if (carregando()) {
    <p>Carregando…</p>
  } @else if (erro()) {
    <p role="alert">{{ erro() }}</p>
  } @else {
    <p>{{ tarefasFiltradas().length }} tarefa(s) encontrada(s).</p>

    <ul class="lista">
      @for (t of tarefasFiltradas(); track t.id) {
        <li><app-tarefa-card [tarefa]="t" /></li>
      } @empty {
        <li>Nenhuma tarefa encontrada.</li>
      }
    </ul>
  }
</section>
