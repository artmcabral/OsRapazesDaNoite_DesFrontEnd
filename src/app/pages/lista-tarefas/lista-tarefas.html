
<section>

  <h2>Tarefas</h2>

  <!-- Barra de busca e filtros compartilhada com o quadro -->
  <app-barra-filtros />

  @if (carregando()) {

    <p>Carregando tarefas...</p>

  } @else if (erro()) {

    <p role="alert">{{ erro() }}</p>

  } @else {

    <p>
      {{ tarefasFiltradas().length }} tarefa(s) encontrada(s).
    </p>

    <ul class="lista">

      @for (t of tarefasFiltradas(); track t.id) {

        <li>
          <app-tarefa-card
            [tarefa]="t"
            (statusAlterado)="aoAlterarStatus($event)"
          />
        </li>

      } @empty {

        <li>Nenhuma tarefa encontrada.</li>

      }

    </ul>

  }

</section>
