<form [formGroup]="form" (ngSubmit)="enviar()">
  <label>
    Título
    <input formControlName="titulo" />
  </label>
  @if (mostrarErro('titulo')) {
    <p class="erro">Informe o título.</p>
  }

  <label>
    Descrição
    <textarea formControlName="descricao"></textarea>
  </label>

  <label>
    Projeto
    <select formControlName="projetoId">
      <option value="" disabled>Escolha um projeto</option>
      @for (p of projetos(); track p.id) {
        <option [value]="p.id">{{ p.nome }}</option>
      }
    </select>
  </label>
  @if (mostrarErro('projetoId')) {
    <p class="erro">Escolha um projeto.</p>
  }

  <label>
    Status
    <select formControlName="status">
      @for (o of statusOpcoes; track o.valor) {
        <option [value]="o.valor">{{ o.rotulo }}</option>
      }
    </select>
  </label>

  <label>
    Prioridade
    <select formControlName="prioridade">
      @for (o of prioridadeOpcoes; track o.valor) {
        <option [value]="o.valor">{{ o.rotulo }}</option>
      }
    </select>
  </label>

  <label>
    Responsável
    <input formControlName="responsavel" />
  </label>
  @if (mostrarErro('responsavel')) {
    <p class="erro">Informe o responsável.</p>
  }

  <label>
    Prazo
    <input type="date" formControlName="prazo" />
  </label>
  @if (mostrarErro('prazo')) {
    <p class="erro">Informe o prazo.</p>
  }

  <button type="submit" [disabled]="enviando()">
    {{ enviando() ? 'Salvando...' : 'Salvar' }}
  </button>
</form>
