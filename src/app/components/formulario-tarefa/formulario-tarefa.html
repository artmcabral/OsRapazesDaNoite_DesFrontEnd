<form [formGroup]="form" (ngSubmit)="enviar()">
   <label>
    Título
    <input
      formControlName="titulo"
      [attr.aria-invalid]="mostrarErro('titulo')"
      [attr.aria-describedby]="mostrarErro('titulo') ? 'erro-titulo' : null"
    />
  </label>
  @if (mostrarErro('titulo')) {
    <p class="erro" id="erro-titulo">Informe o título.</p>
  }

  <label>
    Descrição
    <textarea formControlName="descricao"></textarea>
  </label>

    <label>
    Projeto
    <select
      formControlName="projetoId"
      [attr.aria-invalid]="mostrarErro('projetoId')"
      [attr.aria-describedby]="mostrarErro('projetoId') ? 'erro-projeto' : null"
    >
      <option value="" disabled>Escolha um projeto</option>
      @for (p of projetos(); track p.id) {
        <option [value]="p.id">{{ p.nome }}</option>
      }
    </select>
  </label>
  @if (mostrarErro('projetoId')) {
    <p class="erro" id="erro-projeto">Escolha um projeto.</p>
  }

  <label>
    Status
    <select formControlName="status">
      @for (o of statusOpcoes; track o.valor) {
        <option [value]="o.valor">{{ o.rotulo }}</option>
      }
    </select>
  </label>

  <label>
    Prioridade
    <select formControlName="prioridade">
      @for (o of prioridadeOpcoes; track o.valor) {
        <option [value]="o.valor">{{ o.rotulo }}</option>
      }
    </select>
  </label>

  <label>
    Responsável
    <input
      formControlName="responsavel"
      [attr.aria-invalid]="mostrarErro('responsavel')"
      [attr.aria-describedby]="mostrarErro('responsavel') ? 'erro-responsavel' : null"
    />
  </label>
  @if (mostrarErro('responsavel')) {
    <p class="erro" id="erro-responsavel">Informe o responsável.</p>
  }

    <label>
    Prazo
    <input
      type="date"
      formControlName="prazo"
      [attr.aria-invalid]="mostrarErro('prazo')"
      [attr.aria-describedby]="mostrarErro('prazo') ? 'erro-prazo' : null"
    />
  </label>
  @if (mostrarErro('prazo')) {
    <p class="erro" id="erro-prazo">Informe o prazo.</p>
  }

  <button type="submit" [disabled]="enviando()">
    {{ enviando() ? 'Salvando...' : 'Salvar' }}
  </button>
</form>
